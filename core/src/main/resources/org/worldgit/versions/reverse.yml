# 每條規則在 from > boundary >= to 時執行；registry 差集自動辨識新增內容。
revision: reverse-2026-10-10-16
fallbacks:
  block: minecraft:stone
  item: minecraft:barrier
  biome: minecraft:plains
  entity: skip
  block-entity: skip
boundaries:
