  'minecraft:repair_cost': RepairCost
  'minecraft:custom_model_data': CustomModelData
  'minecraft:block_entity_data': BlockEntityTag
  'minecraft:entity_data': EntityTag
  'minecraft:trim': Trim
  'minecraft:instrument': instrument
  'minecraft:map_id': map
  'minecraft:charged_projectiles': ChargedProjectiles
  'minecraft:bundle_contents': Items
  'minecraft:debug_stick_state': DebugProperty

# 1.20.6–1.21.4 的 BE component patch 只在非空時重存。
omit-empty-fields:
  - {boundary: 4189, kind: block-entity, id: '*', field: components}

# 26.3 招牌安全旗標在舊版不存在：true 與舊行為等價，false 降級會失去禁用能力。
implicit-fields:
  - {boundary: 4903, kind: block-entity, ids: ['minecraft:sign', 'minecraft:hanging_sign'],
     field: allow_op_features, value: 1, source-default: 0}
  - {boundary: 4903, kind: entity, id: '*', field: invulnerable_time, value: 0}
  - {boundary: 4903, kind: block-entity, id: 'minecraft:brewing_stand',
     field: total_brew_time, value: 400, equivalent: [0]}
  - {boundary: 4903, kind: block-entity, id: 'minecraft:brewing_stand',
     field: total_fuel, value: 20, equivalent: [0]}
numeric-fields:
  - {boundary: 4903, kind: block-entity, ids: ['minecraft:furnace', 'minecraft:smoker', 'minecraft:blast_furnace'],
     fields: [cooking_total_time, CookTimeTotal, cooking_time_spent, CookTime, lit_time_remaining, BurnTime, lit_total_time], type: short}
  - {boundary: 4903, kind: block-entity, id: 'minecraft:brewing_stand', fields: [BrewTime], type: short}
  - {boundary: 4903, kind: block-entity, id: 'minecraft:brewing_stand', fields: [Fuel], type: byte}
sign-components:
