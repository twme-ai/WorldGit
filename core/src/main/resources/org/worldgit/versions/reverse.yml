  - {boundary: 4790, kind: item, from: 'minecraft:name_tag', to: 'minecraft:name_tag'}
# 深度遍歷時遇到符合 id 的 compound 才套用，避免改到同名自訂資料。
  - {boundary: 3465, kind: item, from: 'minecraft:short_grass', to: 'minecraft:grass'}
