  - {older: 3700, newer: 3839, changes: [item-components, turtle-scute, wolf-variants, attributes]}
  - {older: 3839, newer: 3955, changes: [enchantment-registry, trial-content]}
  - {older: 3955, newer: 4189, changes: [boat-types, attribute-prefix, custom-model-data]}
