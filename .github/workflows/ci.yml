name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: |
            21
            25
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - run: ./gradlew --configure-on-demand --no-daemon --max-workers=1 build
        env:
          GRADLE_USER_HOME: ${{ github.workspace }}/.work/gradle-home
      - name: Check Paper adapter binary compatibility
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .work/ci-servers
          python3 paper/tools/fetch_paper.py 1.21.11 .work/ci-servers/paper-1.21.11.jar
          python3 paper/tools/fetch_paper.py 26.2 .work/ci-servers/paper-26.2.jar
          python3 paper/tools/check_binary_compat.py \
            paper/plugin/build/libs/worldgit-paper-0.1.0-SNAPSHOT.jar \
            .work/ci-servers/paper-1.21.11.jar org.worldgit.paper.v1_21_11.Bridge_1_21_11
          python3 paper/tools/check_binary_compat.py \
            paper/plugin/build/libs/worldgit-paper-0.1.0-SNAPSHOT.jar \
            .work/ci-servers/paper-26.2.jar org.worldgit.paper.v26_2.Bridge_26_2
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: worldgit-paper
          path: paper/plugin/build/libs/worldgit-paper-*-SNAPSHOT.jar
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wgit
          path: cli/build/libs/wgit.jar
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: worldgit-fabric
          path: |
            fabric/mc1_21_11/build/libs/worldgit-fabric-1.21.11-*-SNAPSHOT.jar
            fabric/mc26_2/build/libs/worldgit-fabric-26.2-*-SNAPSHOT.jar
  hub-web:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: hub/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: hub/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test
  hub-image:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      # 冒煙測試用 wgit 替 core 的測試 fixture 世界建立 repo，再 push 進容器內的 Hub
      - run: ./gradlew --configure-on-demand --no-daemon --max-workers=1 :cli:fatJar
        env:
          GRADLE_USER_HOME: ${{ github.workspace }}/.work/gradle-home
      # 建置映像 → 啟動 → healthcheck → 登入 → git push → 讀回 → 重啟後資料仍在（SQLite）
      - name: Container smoke (SQLite)
        run: ENGINE=docker PORT=18094 hub/scripts/container-smoke.sh
      # 同一流程換 PostgreSQL 後端（沿用上一步建好的映像）
      - name: Container smoke (PostgreSQL)
        run: ENGINE=docker PORT=18094 DB=postgres SKIP_BUILD=1 hub/scripts/container-smoke.sh
  hub-postgres-test:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: ci-pass
          POSTGRES_DB: hub
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d hub" --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: |
            21
            25
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: Hub tests on PostgreSQL
        run: ./gradlew --configure-on-demand --no-daemon --max-workers=1 :hub:test
        env:
          GRADLE_USER_HOME: ${{ github.workspace }}/.work/gradle-home
          WORLDGIT_TEST_POSTGRES_URL: jdbc:postgresql://127.0.0.1:5432/hub
          WORLDGIT_TEST_POSTGRES_PASSWORD: ci-pass
