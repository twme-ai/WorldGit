name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: |
            21
            25
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - run: ./gradlew --configure-on-demand --no-daemon --max-workers=1 build
        env:
          GRADLE_USER_HOME: ${{ github.workspace }}/.work/gradle-home
      - name: Check Paper adapter binary compatibility
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .work/ci-servers
          python3 paper/tools/fetch_paper.py 1.21.11 .work/ci-servers/paper-1.21.11.jar
          python3 paper/tools/fetch_paper.py 26.2 .work/ci-servers/paper-26.2.jar
          python3 paper/tools/check_binary_compat.py \
            paper/plugin/build/libs/worldgit-paper-0.1.0-SNAPSHOT.jar \
            .work/ci-servers/paper-1.21.11.jar org.worldgit.paper.v1_21_11.Bridge_1_21_11
          python3 paper/tools/check_binary_compat.py \
            paper/plugin/build/libs/worldgit-paper-0.1.0-SNAPSHOT.jar \
            .work/ci-servers/paper-26.2.jar org.worldgit.paper.v26_2.Bridge_26_2
          python3 paper/tools/check_binary_compat.py \
            paper/plugin/build/libs/worldgit-paper-0.1.0-SNAPSHOT.jar \
            .work/ci-servers/paper-26.2.jar org.worldgit.paper.v1_21_11.Bridge_1_21_11
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: worldgit-paper
          path: paper/plugin/build/libs/worldgit-paper-*-SNAPSHOT.jar
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: wgit
          path: cli/build/libs/wgit.jar
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: worldgit-fabric
          path: |
            fabric/mc1_21_11/build/libs/worldgit-fabric-1.21.11-*-SNAPSHOT.jar
            fabric/mc26_2/build/libs/worldgit-fabric-26.2-*-SNAPSHOT.jar
  hub-web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hub/web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: hub/web/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test
  hub-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: docker build -f hub/Containerfile -t worldgit-hub:ci .
