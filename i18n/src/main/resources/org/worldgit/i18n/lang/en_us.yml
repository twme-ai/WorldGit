    branch: "Branches:"
    stash: "Stashes:"
    partial: "<red>World is PARTIAL: <message>. Recover with /wg switch <target> --force or /wg reset --hard.</red>"
    dry-run: "Plan (no writes): <stats>"
    switched: "<green>Switched to <target> @ <commit></green>"
