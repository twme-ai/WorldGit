# WorldGit messages (MiniMessage format). Placeholders are MiniMessage tags such as <count>.
# Keys: common.* are shared; paper.* / fabric.* belong to each platform.
# Diff colors follow docs/06 §1.1; use the <wg_added>, <wg_removed>, <wg_modified>, <wg_conflict> tags
# so that the colorblind palette applies everywhere.
common:
  axiom:
    locked: "<red>WorldGit is applying changes. Axiom edit rejected; wait for completion and refresh the editor preview.</red>"
  prefix: "<gray>[<white>WorldGit</white>]</gray> "
  no-permission: "<red>You do not have permission to do that.</red>"
  error: "<red>Error: <message></red>"

paper:
  phase5:
    terminal: "<operation> finished: <status> · <dimension> (<millis> ms)"
    recovery: "<yellow>Check /wg status and the dimension journal; recover with switch --force or reset --hard before committing.</yellow>"
    target-exclusive: "<red>Choose --dimension or --all.</red>"
    world-missing: "<red>The specified world is not loaded.</red>"
    result-title: "Finished: <status>"
    progress: "<aqua><operation> · <dimension> · <phase> · <percent> · ETA <eta></aqua>"
    result: "<aqua><operation> finished: <status></aqua> <dimension> <summary> (<millis> ms)"
    copy: "<yellow>[Copy]</yellow>"
    copy-hover: "<gray>Click to copy error report</gray>"
    console-init: "<red>Console init requires --world &lt;world&gt; --dimension &lt;id&gt; (or --all).</red>"
    init-nether: "<aqua>[Init Nether too]</aqua>"
    init-end: "<aqua>[Init End too]</aqua>"
    init-all: "<aqua>[All]</aqua>"
    graph: "<gray><dimension> graph, page <page></gray>"
    graph-more: "<yellow>[Next page <page> / history truncated]</yellow>"
    ignore-written: "<green>.wgignore updated; commit to save rule history.</green>"
    ignore-valid: "<green>Rules validated: <count> lines.</green>"
    ignore-test: "<gray>excluded=<excluded>; last matching line <line>: <rule></gray>"
    ignore-preview: "<gold>Preview: blocks <blocks>, BE <bes>, entities <entities>, biomes <biomes>, fields <fields>; samples <samples></gold>"
    ignore-confirm: "<yellow>[Confirm change <code>]</yellow>"
    ignore-gui: "<dark_gray>.wgignore · page <page></dark_gray>"
    ignore-controls: "<gray>Left: remove; right: toggle; Shift: move up. Preview before confirmation.</gray>"
    ignore-add: "<green>Add rule (chat input)</green>"
    ignore-chat: "<yellow>Enter one rule in chat to preview the change.</yellow>"
  help:
    title: "WorldGit - version control for Minecraft worlds"
    init: "  /wg init [--template creative|survival]  create repository and initial snapshot"
    status: "  /wg status [--show] [--full]  show changes since the last commit"
    commit: "  /wg commit -m <message>  create a snapshot (no changes means no commit)"
    log: "  /wg log [count]  commit history"
    diff: "  /wg diff [--show] [--radius <chunks>]  block-level changes near you"
    clear: "  /wg clear  clear the client preview"
    reload: "  /wg reload  reload language overrides"
  error:
    permission: "<red>You do not have permission to use /wg <sub> (worldgit.command.<sub>).</red>"
    debug-permission: "<red>You do not have permission (worldgit.debug).</red>"
    unknown-command: "<red>Unknown subcommand: <sub></red>"
    help-command: "Use /wg help for usage."
    internal: "<red>Internal error: <message></red>"
    unknown-option: "<red>Unknown option: <option></red>"
    init-template: "<red>--template must be creative or survival.</red>"
    commit-usage: "<red>Usage: /wg commit -m <message></red>"
    commit-empty: "<red>The commit message must not be empty.</red>"
    log-limit: "<red>Count must be between 1 and 100.</red>"
    diff-player: "<red>/wg diff is centered on your position and can only be used by a player.</red>"
    diff-radius: "<red>--radius must be between 1 and 32.</red>"
    diff-not-tracked: "<red>This world is not tracked by WorldGit.</red>"
    not-initialized: "<red>This dimension has not been initialized.</red>"
    player-only: "<red>Only players have a client preview.</red>"
  init:
    start: "Starting init (template <template>); large worlds take time."
    done: "Initialization complete."
  status:
    title: "Changes since the last commit<suffix>"
    full-suffix: " (full comparison)"
    dimension: "<aqua><dimension></aqua>"
    section-count: "  sections <count>"
    entity-count: "  entities <count>"
    biome-count: "  biomes <count>"
    clean: "  No changes (checked <candidates> candidates)."
    section-label: "[<region> <chunk> y<y>]"
    section-hover: "x <x0>..<x1>  y <y0>..<y1>  z <z0>..<z1>"
    more: "  ... <count> more sections"
    warning: "  ! <text>"
    authors: "Authors (chunks): <names>"
    show-no-mod: "Your client does not have the WorldGit mod, so outlines cannot be shown. The chat list above has clickable coordinates."
    show-no-data: "No displayable data in your current dimension."
    show-empty: "No changes; preview cleared."
    show-sent: "Sent <count> section outline(s) (<packets> packets)."
  commit:
    start: "Creating snapshot..."
    dimension-failed: "<red>  <dimension> failed: <message></red>"
    dimension-changed: "<green>  <dimension></green> <yellow><commit></yellow>"
    below-threshold: "<gray>  <dimension> has <count> changed section(s), below the automatic commit threshold.</gray>"
    unchanged: "<gray>  <dimension> has no changes; no commit was created.</gray>"
    summary: "Snapshot: <items>"
    summary-auto: "Automatic snapshot: <items>"
  log:
    title: "Recent <count> snapshot(s)"
    row: "<gray><time></gray> <message> <aqua><author></aqua>"
    auto: " <gray>[auto]</gray>"
    hover: "committer: <committer>\nsource: <source>\nsnapshot: <snapshot>"
    dimension-failed: "<red><dimension>: <message></red>"
    empty: "No commits yet."
  diff:
    title: "<dimension> block changes within <radius> chunk(s)"
    symbol:
      added: "<wg_added><symbol><count></wg_added>"
      removed: "<wg_removed><symbol><count></wg_removed>"
      modified: "<wg_modified><symbol><count></wg_modified>"
      conflict: "<wg_conflict><symbol><count></wg_conflict>"
    block-label:
      added: "<wg_added><symbol> <x>,<y>,<z></wg_added>"
      removed: "<wg_removed><symbol> <x>,<y>,<z></wg_removed>"
      modified: "<wg_modified><symbol> <x>,<y>,<z></wg_modified>"
      conflict: "<wg_conflict><symbol> <x>,<y>,<z></wg_conflict>"
    block-hover: "<before> -> <after>"
    click-to-teleport: "<dark_gray>Click to suggest a teleport command</dark_gray>"
    no-mod: "Your client does not have the WorldGit mod, so ghosts cannot be shown. The list above has clickable coordinates."
    empty: "No block changes; preview cleared."
    too-large: "Changes exceed <count> blocks; sent region outlines (<packets> packets)."
    sent: "Sent <count> block ghost(s) (<packets> packets, protocol v<version>)."
    send-failed: "<red>Could not send preview: <message></red>"
    more: "  ... <count> more blocks"
  display:
    cells: "No client mod: showing <count> block outline(s) as display entities only you can see (<omitted> omitted by the entity cap). They disappear after <seconds> s; /wg clear removes them now."
    boxes: "No client mod: drew changed regions as display-entity boxes (<count> entities, <omitted> section(s) omitted by the entity cap). They disappear after <seconds> s; /wg clear removes them now."
  clear:
    done: "Preview cleared."
  reload:
    done: "<green>Language overrides reloaded.</green>"

