      branch: <gray>  /wg branch [-d <name>|<name>]</gray>
      stash: <gray>  /wg stash push [message]|pop [index]|list|drop [index]</gray>
      reset: <gray>  /wg reset --hard</gray>
      cancel: <gray>  /wg cancel</gray>
      merge: <gray>  /wg merge <revision>|--continue|--abort</gray>
      resolve: <gray>  /wg resolve <id|all> ours|theirs|base|manual</gray>
      conflict-select: <gray>  /wg conflict-select <id|all> ours|theirs|base|manual</gray>
      conflicts: <gray>  /wg conflicts [page] | /wg conflicts preview <id> ours|theirs|base</gray>
      conflict-preview: <gray>  /wg conflict-preview <id> ours|theirs|base</gray>
      tool: <gray>  /wg tool</gray>
      revert: <gray>  /wg revert <revision></gray>
      cherry-pick: <gray>  /wg cherry-pick <revision></gray>
      remote: <gray>  /wg remote list|add <name> <url>|remove <name>|set-url <name> <url></gray>
      fetch: <gray>  /wg fetch [remote]</gray>
      push: <gray>  /wg push [remote] [branch] [--tags]</gray>
      pull: <gray>  /wg pull [remote] [branch] | /wg pull confirm <code></gray>
      pr: <gray>  /wg pr create [--source <branch>] [--target <branch>] <title> | list | view <id></gray>
      comments: <gray>  /wg comments [show|hide] [pr <id>] [--here|--dimension <key>]</gray>
      comment: <gray>  /wg comment <id> [--here] <text></gray>
      help: <gray>  /wg help [command]</gray>
      debug: <gray>  /wg debug fill|release|probe|measurements|apply|sample|entities|freeze|protection|fixture-container|fixture-clean-items|merge-tool|merge-gui|comment-camera|comment-teleport|comment-displays</gray>
    tip:
      revision: <yellow><hash></yellow> <gray><message></gray>
      stash: <gray><message></gray>
