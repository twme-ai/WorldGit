    help:
      ignore: "/wg ignore list|add|remove|move|enable|disable|test|check|preview|confirm"
      tag: "/wg tag [-d] [name]"
      verify: "/wg verify [revision]"
      init: <gray>  /wg init [--template creative|survival]</gray>
      status: <gray>  /wg status [--full] [--show]</gray>
      commit: <gray>  /wg commit -m <message></gray>
      log: <gray>  /wg log [1..100]</gray>
      diff: <gray>  /wg diff [--show] [--radius 1..32]</gray>
      clear: <gray>  /wg clear</gray>
      reload: <gray>  /wg reload</gray>
      restore: <gray>  /wg restore <revision> [--selection|--chunks 0..256|--box <from> <to>] [--dry-run]</gray>
